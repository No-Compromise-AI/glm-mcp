# Runs on every pull request and on main. This is what branch protection should
# require: a PR that merges without its tests having run is a PR nobody checked.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Supersede in-flight runs for the same ref: a force-push or a quick second
# commit should not leave two runs racing to report on the same PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # a fork PR gets a read-only token and no secrets

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # report every failing version, not just the first
      matrix:
        node: ['20', '22', '24']  # 20 is the floor declared in engines
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: npm run verify:ignore
      - run: npm run verify:globs
      - run: npm run verify:confinement
      - run: npm run verify:limits
      - run: npm run verify:redos
      - run: npm run verify:release
      - run: npm run verify:routing
      - run: npm run verify:budget
      - run: npm run verify:thinking
      - run: npm run verify:window
      - run: npm run verify:lines
      - run: npm run verify:thread
      - run: npm run verify:progress
      - run: npm run verify:searchroot
      - run: npm run verify:blocking
      - run: npm run verify:api
      - run: npm run verify:capacity
      - run: npm run verify:disclosure
      - run: npm run verify:supplychain
      - run: npm run verify:completeness
      - run: npm run verify:host-routing
      - run: npm run verify:review
      - run: npm run verify:docs
      - run: npm run verify:drain
      - run: npm run verify:worker
      - run: npm run verify:delegation
      - run: npm run verify:ledger
      - run: npm run verify:evidence
      - run: npm run verify:assumption
      - run: npm run verify:branch
      - run: npm run verify:unreviewed
